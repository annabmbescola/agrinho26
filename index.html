<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agrinho 2050</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:800px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

h1{
    color:#2e7d32;
    text-align:center;
    margin-bottom:20px;
}

.indicadores{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:25px;
}

.card{
    background:#e8f5e9;
    padding:10px;
    border-radius:10px;
    font-weight:bold;
}

.pergunta{
    font-size:1.2rem;
    margin-bottom:20px;
}

button{
    width:100%;
    margin:10px 0;
    padding:15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:1rem;
    transition:.3s;
}

.opcao{
    background:#43a047;
    color:white;
}

.opcao:hover{
    background:#2e7d32;
}

.resultado{
    text-align:center;
}

.resultado h2{
    margin-bottom:15px;
}

.hidden{
    display:none;
}
</style>
</head>
<body>

<div class="container">

    <h1>🌱 AGRINHO 2050</h1>

    <div class="indicadores">
        <div class="card">🌱 Sustentabilidade: <span id="sus">50</span></div>
        <div class="card">💰 Economia: <span id="eco">50</span></div>
        <div class="card">💧 Água: <span id="agua">50</span></div>
        <div class="card">🌳 Biodiversidade: <span id="bio">50</span></div>
    </div>

    <div id="quiz">
        <p class="pergunta" id="pergunta"></p>
        <div id="opcoes"></div>
    </div>

    <div id="resultado" class="resultado hidden">
        <h2>Resultado Final</h2>
        <h3 id="perfil"></h3>

        <br>

        <p>🌱 Sustentabilidade: <span id="fSus"></span></p>
        <p>💰 Economia: <span id="fEco"></span></p>
        <p>💧 Água: <span id="fAgua"></span></p>
        <p>🌳 Biodiversidade: <span id="fBio"></span></p>

        <br>

        <button onclick="location.reload()">Jogar Novamente</button>
    </div>

</div>

<script>

let sustentabilidade = 50;
let economia = 50;
let agua = 50;
let biodiversidade = 50;

const perguntas = [
{
    pergunta: "Como você deseja irrigar sua plantação?",
    opcoes:[
        {
            texto:"Sistema tradicional",
            efeito:{eco:10, agua:-15, sus:-10}
        },
        {
            texto:"Sistema de gotejamento",
            efeito:{eco:-10, agua:15, sus:10}
        }
    ]
},
{
    pergunta:"Existe uma área de mata nativa. O que fazer?",
    opcoes:[
        {
            texto:"Desmatar para produzir mais",
            efeito:{eco:15, bio:-20, sus:-15}
        },
        {
            texto:"Preservar a área",
            efeito:{eco:-5, bio:15, sus:15}
        }
    ]
},
{
    pergunta:"Qual fonte de energia utilizar?",
    opcoes:[
        {
            texto:"Energia convencional",
            efeito:{eco:5}
        },
        {
            texto:"Energia solar",
            efeito:{eco:-10, sus:15}
        }
    ]
},
{
    pergunta:"Como descartar os resíduos?",
    opcoes:[
        {
            texto:"Descartar incorretamente",
            efeito:{eco:5, sus:-20}
        },
        {
            texto:"Reciclar e tratar corretamente",
            efeito:{sus:15}
        }
    ]
},
{
    pergunta:"Uma seca atingiu a região. O que fazer?",
    opcoes:[
        {
            texto:"Manter consumo normal",
            efeito:{agua:-20}
        },
        {
            texto:"Economizar água",
            efeito:{agua:10, sus:15}
        }
    ]
}
];

let atual = 0;

function atualizarIndicadores(){
    document.getElementById("sus").textContent = sustentabilidade;
    document.getElementById("eco").textContent = economia;
    document.getElementById("agua").textContent = agua;
    document.getElementById("bio").textContent = biodiversidade;
}

function mostrarPergunta(){

    if(atual >= perguntas.length){
        finalizar();
        return;
    }

    const pergunta = perguntas[atual];

    document.getElementById("pergunta").textContent =
    pergunta.pergunta;

    const opcoesDiv = document.getElementById("opcoes");
    opcoesDiv.innerHTML = "";

    pergunta.opcoes.forEach(opcao => {

        const btn = document.createElement("button");

        btn.classList.add("opcao");
        btn.textContent = opcao.texto;

        btn.onclick = () => {

            sustentabilidade += opcao.efeito.sus || 0;
            economia += opcao.efeito.eco || 0;
            agua += opcao.efeito.agua || 0;
            biodiversidade += opcao.efeito.bio || 0;

            atualizarIndicadores();

            atual++;
            mostrarPergunta();
        };

        opcoesDiv.appendChild(btn);
    });
}

function finalizar(){

    document.getElementById("quiz").classList.add("hidden");
    document.getElementById("resultado").classList.remove("hidden");

    let perfil = "";

    if(sustentabilidade >= 80){
        perfil = "🌟 Guardião da Natureza";
    }
    else if(sustentabilidade >= 60){
        perfil = "🌱 Produtor Sustentável";
    }
    else if(sustentabilidade >= 40){
        perfil = "⚖️ Em Transição";
    }
    else{
        perfil = "⚠️ Alto Impacto Ambiental";
    }

    document.getElementById("perfil").textContent = perfil;

    document.getElementById("fSus").textContent = sustentabilidade;
    document.getElementById("fEco").textContent = economia;
    document.getElementById("fAgua").textContent = agua;
    document.getElementById("fBio").textContent = biodiversidade;
}

mostrarPergunta();
atualizarIndicadores();

</script>

</body>
</html>
